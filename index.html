<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-In (عين) - Attendance Management</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-container">
            <div class="header-brand">
                <h1 class="brand-logo">
                    <i class="fas fa-eye brand-icon"></i>
                    <i class="fa-solid fa-fingerprint"></i>
                    <span data-i18n="app-name"> A-In (عين)</span>
                </h1>
            </div>

            <!-- Navigation (visible when authenticated) -->
            <nav id="main-nav" class="main-nav" style="display: none;">
                <a href="#/dashboard" data-route="/dashboard">
                    <i class="fas fa-chart-line"></i>
                    <span data-i18n="dashboard">Dashboard</span>
                </a>
                <a href="#/attendance" data-route="/attendance" data-role-required="employee,manager,owner">
                    <i class="fas fa-calendar-check"></i>
                    <span data-i18n="attendance">Attendance</span>
                </a>
                <a href="#/employees" data-route="/employees" data-role-required="manager,owner">
                    <i class="fas fa-users"></i>
                    <span data-i18n="employees">Employees</span>
                </a>
                <a href="#/attendance-history" data-route="/attendance-history">
                    <i class="fas fa-history"></i>
                    <span data-i18n="view-history">History</span>
                </a>
            </nav>

            <!-- Theme & Language Controls (always visible) -->
            <div class="theme-controls">
                <button id="theme-toggle" class="btn-icon" aria-label="Toggle theme" title="Toggle theme">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
                <button id="lang-toggle" class="btn-icon" aria-label="Toggle language" title="Toggle language">
                    <i class="fas fa-language"></i>
                </button>
            </div>

            <!-- User menu (visible when authenticated) -->
            <div id="user-menu" class="user-menu" style="display: none;">
                <span id="user-name" class="user-name">
                    <i class="fas fa-user-circle"></i>
                    <span>User</span>
                </span>
                <a href="#/profile" data-route="/profile" class="btn btn-secondary">
                    <i class="fas fa-user-cog"></i>
                    <span data-i18n="profile">Profile</span>
                </a>
                <button id="logout-btn" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i>
                    <span data-i18n="logout">Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="app-content" class="app-content">
        <!-- Content will be rendered here -->
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>&copy; 2025 A-In (عين) - Attendance Management System</p>
    </footer>

    <!-- App Script (ES6 Module) -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
