<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-In (عين) - Attendance Management</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="A-In (عين) - Modern bilingual attendance and workforce management system with GPS tracking, selfie verification, and real-time analytics. Built for teams of all sizes.">
    <meta name="keywords" content="attendance tracking, workforce management, GPS check-in, employee management, time tracking, biometric attendance, Arabic, bilingual">
    <meta name="author" content="AbdouMatrix">
    <link rel="canonical" href="https://abdouthematrix.github.io/AIn-Web/">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English, Arabic">
    
    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://abdouthematrix.github.io/AIn-Web/">
    <meta property="og:title" content="A-In (عين) - Attendance & Workforce Management">
    <meta property="og:description" content="Modern attendance tracking with GPS validation, selfie verification, and real-time analytics. Support for multiple companies with role-based access control.">
    <meta property="og:image" content="https://abdouthematrix.github.io/AIn-Web/icons/icon-512x512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="A-In Logo - Eye with fingerprint">

    <meta property="og:locale:alternate" content="ar_EG">
    
    <!-- PWA Support -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="A-In">
    
    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180x180.png">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-container">
            <div class="header-brand">
                <h1 class="brand-logo">
                    <span class="fa-stack" style="color: var(--primary-color); -webkit-text-fill-color: initial !important;">
                        <i class="fa-solid fa-eye fa-stack-2x"></i>
                        <i class="fa-solid fa-fingerprint fa-stack-1x fa-inverse"></i>
                    </span>
                    <span data-i18n="app-name"> A-In (عين)</span>
                </h1>
            </div>

            <!-- Navigation (visible when authenticated) -->
            <nav id="main-nav" class="main-nav" style="display: none;">
                <a href="#/dashboard" data-route="/dashboard">
                    <i class="fas fa-chart-line"></i>
                    <span data-i18n="dashboard">Dashboard</span>
                </a>
                <a href="#/attendance" data-route="/attendance" data-role-required="employee,manager,owner">
                    <i class="fas fa-calendar-check"></i>
                    <span data-i18n="attendance">Attendance</span>
                </a>
                <a href="#/employees" data-route="/employees" data-role-required="manager,owner">
                    <i class="fas fa-users"></i>
                    <span data-i18n="employees">Employees</span>
                </a>
                <a href="#/attendance-history" data-route="/attendance-history">
                    <i class="fas fa-history"></i>
                    <span data-i18n="view-history">History</span>
                </a>
            </nav>

            <!-- Theme & Language Controls (always visible) -->
            <div class="theme-controls">
                <button id="theme-toggle" class="btn-icon" aria-label="Toggle theme" title="Toggle theme">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
                <button id="lang-toggle" class="btn-icon" aria-label="Toggle language" title="Toggle language">
                    <i class="fas fa-language"></i>
                </button>
            </div>

            <!-- User menu (visible when authenticated) -->
            <div id="user-menu" class="user-menu" style="display: none;">
                <span id="user-name" class="user-name">
                    <i class="fas fa-user-circle"></i>
                    <span>User</span>
                </span>
                <a href="#/profile" data-route="/profile" class="btn btn-secondary">
                    <i class="fas fa-user-cog"></i>
                    <span data-i18n="profile">Profile</span>
                </a>
                <button id="logout-btn" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i>
                    <span data-i18n="logout">Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="app-content" class="app-content">
        <!-- Content will be rendered here -->
    </main>

    <!-- Toast Container for Stacking -->
    <div id="toast-container"></div>

    <!-- Footer -->
    <footer class="app-footer">
        <p>&copy; 2025 A-In (عين) - Attendance Management System</p>
    </footer>

    <!-- App Script (ES6 Module) -->
    <script type="module" src="./js/app.js"></script>
    <!-- Service Worker Registration Script (add before closing </body> tag) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('✓ Service Worker registered:', registration.scope);

                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New service worker available, show update prompt
                                    if (confirm('New version available! Reload to update?')) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.warn('⚠ Service Worker registration failed:', error);
                    });
            });

            // Reload page when new service worker takes control
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
